name: Robot vacuum
products:
  - id: 731gczsu2tfvj0nn
    manufacturer: HONOR CHOICE
    model: Robot Cleaner R3
entities:
  - entity: vacuum
    dps:
      - id: 1
        type: boolean
        name: activate
        optional: true
        mapping:
          - dps_val: true
            value: true
          - dps_val: false
            value: false
            value_redirect: pause
          - dps_val: null
            value: false
            hidden: true
      - id: 2
        type: boolean
        optional: true
        name: pause
        hidden: true
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true
          - dps_val: null
            value: false
            hidden: true
      # Setting dp4 to chargego alone only changes the mode; dp3 actually
      # sends the robot to the dock.
      - id: 3
        type: boolean
        name: dock
        optional: true
        hidden: true
        mapping:
          - dps_val: true
            value: return_to_base
          - dps_val: false
            value: return_to_base
            hidden: true
          - dps_val: null
            value: return_to_base
            hidden: true
      - id: 4
        type: string
        name: command
        mapping:
          - dps_val: smart
            value: smart
          - dps_val: chargego
            value: return_to_base
            value_redirect: dock
          - dps_val: zone
            value: zone
          - dps_val: pose
            value: go_to_position
          - dps_val: part
            value: partial
          - dps_val: wallfollow
            value: wall_follow
          - dps_val: selectroom
            value: room
      - id: 5
        type: string
        name: status
        mapping:
          - dps_val: standby
            value: standby
          - dps_val: smart
            value: cleaning
          - dps_val: smart_clean
            value: cleaning
          - dps_val: zone_clean
            value: cleaning
          - dps_val: part_clean
            value: cleaning
          - dps_val: cleaning
            value: cleaning
          - dps_val: paused
            value: paused
          - dps_val: goto_pos
            value: going_to_location
          - dps_val: pos_arrived
            value: on_location
          - dps_val: pos_unarrive
            value: cannot_find_location
          - dps_val: goto_charge
            value: returning
          - dps_val: charging
            value: charging
          - dps_val: charge_done
            value: charged
          - dps_val: sleep
            value: sleep
          - dps_val: select_room
            value: select_room
          - dps_val: wall_follow
            value: wall_follow
          - dps_val: direction_control
            value: direction_control
          - dps_val: repositing
            value: repositioning
          - dps_val: create_map
            value: mapping
          - dps_val: fault
            value: error
      - id: 9
        type: string
        name: fan_speed
        mapping:
          - dps_val: turnoff
            value: "Off"
          - dps_val: gentle
            value: Low
          - dps_val: normal
            value: Medium
          - dps_val: strong
            value: High
          - dps_val: strong_plus
            value: Max
      - id: 11
        type: boolean
        optional: true
        name: locate
      - id: 12
        type: string
        optional: true
        name: direction_control
        mapping:
          - dps_val: forward
            value: forward
          - dps_val: backward
            value: reverse
          - dps_val: turn_left
            value: left
          - dps_val: turn_right
            value: right
          - dps_val: stop
            value: stop
          - dps_val: exit
            value: exit
      - id: 14
        type: string
        optional: true
        name: path_data
      - id: 15
        type: string
        optional: true
        name: complex_command
      - id: 16
        type: string
        optional: true
        name: request
        mapping:
          - dps_val: get_map
            value: Get map
          - dps_val: get_path
            value: Get path
          - dps_val: get_both
            value: Get both
      - id: 28
        type: bitfield
        name: error
        hidden: true
      # - id: 32
      #   type: string
      #   optional: true
      #   name: device_timer
      - id: 33
        type: string
        optional: true
        name: disturb_time_set
      # - id: 34
      #   type: string
      #   optional: true
      #   name: device_info
      - id: 35
        type: string
        optional: true
        name: voice_data
  - entity: button
    name: Start
    icon: "mdi:play"
    category: config
    dps:
      - id: 1
        type: boolean
        name: button
        optional: true
  - entity: button
    name: Pause
    category: config
    icon: "mdi:pause"
    dps:
      - id: 2
        type: boolean
        name: button
        optional: true
  - entity: button
    name: Dock
    category: config
    icon: "mdi:lightning-bolt"
    dps:
      - id: 3
        type: boolean
        name: button
        optional: true
  - entity: sensor
    name: Cleaning time
    class: duration
    category: diagnostic
    dps:
      - id: 6
        type: integer
        name: sensor
        unit: min
        class: measurement
  - entity: sensor
    name: Cleaned area
    class: area
    category: diagnostic
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: m2
  - entity: sensor
    class: battery
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: select
    translation_key: mopping
    category: config
    dps:
      - id: 10
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: closed
            value: "off"
          - dps_val: low
            value: low
          - dps_val: middle
            value: medium
          - dps_val: high
            value: high
          - dps_val: null
            value: "off"
            hidden: true
  - entity: button
    name: Reset map
    category: config
    dps:
      - id: 13
        type: boolean
        name: button
        optional: true
  - entity: sensor
    name: Edge brush life
    class: duration
    category: diagnostic
    dps:
      - id: 17
        type: integer
        name: sensor
        unit: min
  - entity: button
    name: Edge brush reset
    class: restart
    category: config
    dps:
      - id: 18
        type: boolean
        name: button
        optional: true
  - entity: sensor
    name: Roll brush life
    class: duration
    category: diagnostic
    dps:
      - id: 19
        type: integer
        name: sensor
        unit: min
  - entity: button
    name: Roll brush reset
    class: restart
    category: config
    dps:
      - id: 20
        type: boolean
        name: button
        optional: true
  - entity: sensor
    translation_key: filter_life
    class: duration
    category: diagnostic
    dps:
      - id: 21
        type: integer
        name: sensor
        unit: min
  - entity: button
    translation_key: filter_reset
    category: config
    dps:
      - id: 22
        type: boolean
        name: button
        optional: true
  - entity: sensor
    name: Mop life
    class: duration
    category: diagnostic
    dps:
      - id: 23
        type: integer
        name: sensor
        unit: min
  - entity: button
    name: Mop reset
    class: restart
    category: config
    dps:
      - id: 24
        type: boolean
        name: button
        optional: true
  - entity: switch
    translation_key: do_not_disturb
    category: config
    dps:
      - id: 25
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: false
            hidden: true
  - entity: number
    translation_key: volume
    category: config
    dps:
      - id: 26
        type: integer
        name: value
        range:
          min: 0
          max: 100
        unit: "%"
      - id: 36
        name: language
        type: string
        optional: true
  - entity: switch
    name: Locate
    icon: "mdi:map-marker-radius"
    dps:
      - id: 11
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: false
            hidden: true
  - entity: text
    name: Schedule
    icon: "mdi:calendar-clock"
    category: config
    dps:
      - id: 32
        type: base64
        name: value
        optional: true
  - entity: switch
    name: Resume cleaning
    icon: "mdi:play-pause"
    category: config
    dps:
      - id: 27
        type: boolean
        name: switch
        optional: true
  - entity: switch
    name: Custom mode
    icon: "mdi:floor-plan"
    category: config
    dps:
      - id: 39
        type: boolean
        name: switch
        optional: true
  - entity: switch
    name: Auto carpet boost
    icon: "mdi:rug"
    category: config
    dps:
      - id: 45
        type: boolean
        name: switch
        optional: true
  - entity: sensor
    name: Message
    class: enum
    category: diagnostic
    icon: "mdi:message-alert-outline"
    dps:
      - id: 199
        type: string
        name: sensor
        optional: true
        mapping:
          - dps_val: "0"
            value: none
          - dps_val: "1"
            value: scheduled_clean_started
          - dps_val: "3"
            value: low_battery_returning
          - dps_val: "4"
            value: dock_not_found
          - dps_val: "6"
            value: clean_finished_returning
          - dps_val: "7"
            value: update_failed
          - dps_val: "8"
            value: update_succeeded
          - dps_val: "14"
            value: low_battery_shutdown
          - dps_val: "16"
            value: low_battery_charge_first
          - dps_val: "18"
            value: mop_plate_attached
          - dps_val: "19"
            value: mop_plate_removed
          - dps_val: "20"
            value: update_started
          - dps_val: "21"
            value: updating
          - dps_val: "22"
            value: repositioning
          - dps_val: "24"
            value: dust_bag_missing
          - dps_val: "25"
            value: dust_bag_full
          - dps_val: "26"
            value: already_charging
          - dps_val: "27"
            value: dust_collection_too_frequent
          - dps_val: "28"
            value: dust_duct_blocked
          - dps_val: "29"
            value: dust_bin_cover_open
          - dps_val: "30"
            value: dust_collecting
          - dps_val: "31"
            value: dust_collection_interrupted
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 28
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 28
        type: bitfield
        name: fault_code
      - id: 28
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 2
            value: left_wheel_hang
          - dps_val: 4
            value: main_brush_stuck
          - dps_val: 8
            value: right_wheel_hang
          - dps_val: 16
            value: left_wheel_stuck
          - dps_val: 32
            value: right_wheel_stuck
          - dps_val: 64
            value: cliff
          - dps_val: 128
            value: side_brush_stuck
          - dps_val: 512
            value: collision
          - dps_val: 1024
            value: dust_box_stuck
          - dps_val: 4096
            value: ground_check_failure
          - dps_val: 32768
            value: vacuum_motor_stuck
          - dps_val: 65536
            value: high_current
          - dps_val: 131072
            value: charge_port_closed
